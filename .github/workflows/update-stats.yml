name: Update GitHub Stats

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/scripts/generate-stats.py
      - .github/workflows/update-stats.yml

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - uses: actions/setup-node@v4

      - name: Install GitHub CLI
        run: type gh || (curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg && echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null && sudo apt update && sudo apt install gh -y)

      - name: Generate stats SVG
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_USERNAME: JP-Schuster
        run: python3 .github/scripts/generate-stats.py

      - name: Commit updated stats
        run: |
          git config user.name "JP-Schuster"
          git config user.email "domianduakoc@gmail.com"
          git add assets/github-stats.svg assets/github-langs.svg assets/github-trophies.svg
          git diff --staged --quiet && exit 0
          git commit -m "Atualiza GitHub stats com contribuicoes em organizations."
          git push
